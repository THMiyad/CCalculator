<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #12121c; color: #fff; }
        
        /* Real Casio Physical Body Layout */
        .calculator { background: #191924; padding: 16px; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.8); width: 380px; border: 2px solid #2d2d42; }

        /* Dual-Line LCD Display Screen */
        .lcd-screen { background: #8fa38f; color: #0b140b; padding: 10px 12px; border-radius: 4px; margin-bottom: 12px; border: 3px inset #525e52; }
        .lcd-top { font-size: 11px; font-family: 'Courier New', Courier, monospace; min-height: 15px; text-align: right; color: #2d3b2d; overflow-x: auto; white-space: nowrap; }
        #display { width: 100%; height: 38px; background: transparent; color: #0b140b; font-size: 25px; font-family: 'Courier New', Courier, monospace; font-weight: bold; text-align: right; border: none; outline: none; }

        /* Keypad Grid matching Real Casio Layout */
        .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        button { padding: 9px 2px; font-size: 11px; cursor: pointer; border: none; border-radius: 4px; background: #262636; color: #e0e0f0; font-weight: 600; transition: 0.08s; }
        button:active { transform: scale(0.95); }

        /* Precise Color Coding based on Real Device */
        button.shift { background: #d97706; color: #fff; font-weight: bold; } /* Yellow Shift */
        button.alpha { background: #6366f1; color: #fff; font-weight: bold; } /* Purple Alpha */
        button.mode-key { background: #33334d; color: #38bdf8; font-weight: bold; }
        button.math-op { color: #f472b6; }
        button.operator { color: #38bdf8; font-weight: bold; }
        button.del-btn { background: #15803d; color: #fff; font-weight: bold; } /* Dark Green DEL */
        button.ac-btn { background: #dc2626; color: #fff; font-weight: bold; } /* Red AC */
        button.equal { background: #16a34a; color: #fff; font-weight: bold; } /* Green Equals */
    </style>
</head>
<body>

    <div class="calculator">
        <!-- LCD Display Screen -->
        <div class="lcd-screen">
            <div class="lcd-top" id="lcdTop">NATURAL-V.P.A.M.</div>
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <!-- Keypad Layout -->
        <div class="buttons">
            <!-- Row 1 -->
            <button class="shift">shift</button>
            <button class="alpha">alpha</button>
            <button class="math-op" onclick="appendValue('Math.sin(')">sin</button>
            <button class="math-op" onclick="appendValue('Math.cos(')">cos</button>
            <button class="math-op" onclick="appendValue('Math.tan(')">tan</button>

            <!-- Row 2 -->
            <button class="math-op" onclick="appendValue('Math.sqrt(')">√</button>
            <button class="math-op" onclick="appendValue('**2')">x²</button>
            <button class="math-op" onclick="appendValue('**')">x^y</button>
            <button class="math-op" onclick="appendValue('Math.PI')">π</button>
            <button class="ac-btn" onclick="clearDisplay()">AC</button>

            <!-- Row 3 -->
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="del-btn" onclick="backspace()">DEL</button>
            <button class="ac-btn" onclick="clearDisplay()">OFF</button>

            <!-- Row 4 -->
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <!-- Row 5 -->
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <!-- Row 6 -->
            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="math-op" onclick="appendValue('10**')">×10ˣ</button>
            <button class="math-op" onclick="appendValue('ans')">Ans</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const lcdTop = document.getElementById('lcdTop');
        let lastAns = 0;

        function appendValue(val) { 
            if(val === 'ans') { display.value += lastAns; }
            else { display.value += val; }
        }
        function clearDisplay() { 
            display.value = ''; 
            lcdTop.innerText = 'NATURAL-V.P.A.M.';
        }
        function backspace() { 
            display.value = display.value.slice(0, -1); 
        }
        function calculate() {
            try { 
                lcdTop.innerText = display.value + ' =';
                let res = eval(display.value);
                if(Number.isFinite(res)) {
                    lastAns = res;
                    display.value = res;
                } else {
                    display.value = 'Math Error';
                }
            } catch (e) { 
                display.value = 'Syntax Error'; 
            }
        }
    </script>
</body>
</html>
