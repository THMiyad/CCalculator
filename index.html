<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0e0e13; color: #fff; }
        
        .calculator { background: #16161f; padding: 15px; border-radius: 12px; box-shadow: 0 15px 45px rgba(0,0,0,0.9); width: 400px; border: 2px solid #272738; }

        /* Screen Design */
        .lcd-screen { background: #8fa38f; color: #0b140b; padding: 10px; border-radius: 6px; margin-bottom: 12px; border: 3px inset #525e52; }
        .lcd-top { font-size: 11px; font-family: 'Courier New', Courier, monospace; color: #2d3b2d; min-height: 16px; font-weight: bold; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #display { width: 100%; height: 40px; background: transparent; color: #0b140b; font-size: 24px; font-family: 'Courier New', Courier, monospace; font-weight: bold; text-align: right; border: none; outline: none; }

        /* Keypad Grid (5 Columns) */
        .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 2px; font-size: 13px; cursor: pointer; border: none; border-radius: 4px; background: #222230; color: #f1f5f9; font-weight: 600; height: 42px; transition: 0.05s; }
        .btn:active { transform: scale(0.93); background: #323246; }

        /* Color Scheme */
        .shift-key { background: #d97706 !important; color: #fff !important; font-weight: bold; }
        .math-op { color: #f472b6; }
        .operator { color: #38bdf8; font-weight: bold; }
        .ac-key { background: #dc2626 !important; color: #fff !important; font-weight: bold; }
        .del-key { background: #15803d !important; color: #fff !important; font-weight: bold; }
        .eq-key { background: #16a34a !important; color: #fff !important; font-weight: bold; font-size: 16px; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Screen -->
        <div class="lcd-screen">
            <div class="lcd-top" id="lcdTop">MATH</div>
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <!-- Keypad -->
        <div class="buttons">
            <button class="btn shift-key" onclick="clearDisplay()">AC</button>
            <button class="btn del-key" onclick="backspace()">DEL</button>
            <button class="btn math-op" onclick="appendValue('(')">(</button>
            <button class="btn math-op" onclick="appendValue(')')">)</button>
            <button class="btn operator" onclick="appendValue('/')">÷</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn math-op" onclick="appendValue('Math.sqrt(')">√</button>
            <button class="btn operator" onclick="appendValue('*')">×</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn math-op" onclick="appendValue('**2')">x²</button>
            <button class="btn operator" onclick="appendValue('-')">-</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>
            <button class="btn math-op" onclick="appendValue('**')">xʸ</button>
            <button class="btn operator" onclick="appendValue('+')">+</button>

            <button class="btn" onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
            <button class="btn math-op" onclick="appendValue('Math.PI')">π</button>
            
            <button class="btn eq-key" onclick="calculate()">=</button>
            
            <!-- Extra Scientific Functions -->
            <button class="btn math-op" onclick="appendValue('Math.sin(')">sin</button>
            <button class="btn math-op" onclick="appendValue('Math.cos(')">cos</button>
            <button class="btn math-op" onclick="appendValue('Math.tan(')">tan</button>
            <button class="btn math-op" onclick="appendValue('Math.log10(')">log</button>
            <button class="btn math-op" onclick="appendValue('Math.log(')">ln</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const lcdTop = document.getElementById('lcdTop');
        let currentExpression = '';

        function appendValue(val) {
            currentExpression += val;
            display.value = currentExpression;
        }

        function clearDisplay() {
            currentExpression = '';
            display.value = '';
            lcdTop.innerText = 'MATH';
        }

        function backspace() {
            currentExpression = currentExpression.slice(0, -1);
            display.value = currentExpression;
        }

        function calculate() {
            try {
                lcdTop.innerText = display.value + ' =';
                // Safe evaluation of the math expression
                let result = eval(currentExpression);
                if (Number.isFinite(result)) {
                    display.value = result;
                    currentExpression = result.toString();
                } else {
                    display.value = 'Math Error';
                }
            } catch (error) {
                display.value = 'Syntax Error';
            }
        }
    </script>
</body>
</html>
