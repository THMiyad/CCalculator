<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Scientific Calculator Pro - v2</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #151522; color: #fff; }
        .calculator { background: #252538; padding: 20px; border-radius: 16px; box-shadow: 0 10px 35px rgba(0,0,0,0.7); width: 420px; border: 1px solid #3d3d5c; }
        #display { width: 100%; height: 65px; background: #12121a; color: #00ffcc; font-size: 26px; text-align: right; padding: 12px; border: none; border-radius: 8px; margin-bottom: 12px; outline: none; }
        .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        button { padding: 11px 4px; font-size: 13px; cursor: pointer; border: none; border-radius: 6px; background: #33334d; color: #ffffff; font-weight: 600; transition: 0.2s; }
        button:hover { background: #47476b; }
        button.operator { background: #ff8800; }
        button.sci { background: #3d3dcc; }
        button.menu-btn { background: #e68a00; grid-column: span 5; font-size: 15px; padding: 12px; margin-bottom: 6px; font-weight: bold; }
        button.equal { background: #28a745; grid-column: span 2; }
        
        /* Modal Styles */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #1e1e2d; padding: 22px; border-radius: 12px; width: 380px; max-height: 90vh; overflow-y: auto; border: 2px solid #3d3dcc; box-shadow: 0 8px 30px rgba(0,0,0,0.6); }
        .modal-content h3 { margin-bottom: 12px; color: #ffaa00; font-size: 18px; text-align: center; border-bottom: 1px solid #33334d; padding-bottom: 8px; }
        .modal-content select, .modal-content input { width: 100%; padding: 10px; margin: 8px 0; background: #12121a; border: 1px solid #3d3dcc; color: #fff; border-radius: 6px; outline: none; font-size: 14px; }
        .modal-content button.action-btn { width: 100%; margin-top: 8px; background: #28a745; padding: 10px; font-size: 14px; font-weight: bold; border-radius: 6px; border: none; cursor: pointer; color: #fff; }
        .modal-content button.action-btn:hover { background: #218838; }
        .close-btn { background: #dc3545 !important; margin-top: 15px !important; width: 100%; padding: 10px; border-radius: 6px; border: none; color: #fff; font-weight: bold; cursor: pointer; }
        
        /* Classic Calculator Screen Output Style */
        .result-box { 
            margin-top: 14px; 
            background: #b5c7b5; 
            color: #0d1a0d; 
            padding: 14px; 
            border-radius: 6px; 
            font-size: 15px; 
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            word-break: break-all; 
            line-height: 1.6; 
            border: 3px inset #7a997a;
            min-height: 55px;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>
        <button class="menu-btn" onclick="openMenu()">☰ Menu / Advanced Modes (Pro v2)</button>
        <div class="buttons">
            <button class="sci" onclick="appendValue('Math.sin(')">sin</button>
            <button class="sci" onclick="appendValue('Math.cos(')">cos</button>
            <button class="sci" onclick="appendValue('Math.tan(')">tan</button>
            <button class="sci" onclick="appendValue('Math.PI')">π</button>
            <button class="sci" onclick="appendValue('Math.E')">e</button>

            <button class="sci" onclick="appendValue('Math.asin(')">asin</button>
            <button class="sci" onclick="appendValue('Math.acos(')">acos</button>
            <button class="sci" onclick="appendValue('Math.atan(')">atan</button>
            <button class="sci" onclick="appendValue('Math.sqrt(')">√</button>
            <button class="sci" onclick="appendValue('**2')">x²</button>

            <button class="sci" onclick="appendValue('Math.log10(')">log</button>
            <button class="sci" onclick="appendValue('Math.log(')">ln</button>
            <button class="sci" onclick="appendValue('**')">x^y</button>
            <button class="sci" onclick="appendValue('(')">(</button>
            <button class="sci" onclick="appendValue(')')">)</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="clearDisplay()">C</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="backspace()">⌫</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <!-- Advanced Menu Modal -->
    <div id="menuModal" class="modal">
        <div class="modal-content">
            <h3>Scientific Calculator Modes</h3>
            <select id="modeSelect" onchange="switchMode()">
                <option value="">-- Select Advanced Mode --</option>
                <option value="base">1. Base-N Converter (Dec, Hex, Oct, Bin)</option>
                <option value="quad">2. Quadratic Equation (ax² + bx + c = 0)</option>
                <option value="stat">3. Statistics (Sum, Mean, Std Dev)</option>
                <option value="matrix">4. Matrix Addition</option>
                <option value="vector">5. Vector Dot & Cross</option>
                <option value="finance">6. Financial Interest</option>
            </select>
            <div id="modeBody"></div>
            <button class="close-btn" onclick="closeMenu()">Exit Menu</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        function appendValue(val) { display.value += val; }
        function clearDisplay() { display.value = ''; }
        function backspace() { display.value = display.value.slice(0, -1); }
        function calculate() {
            try { 
                let res = eval(display.value);
                display.value = Number.isFinite(res) ? res : 'Error';
            } catch (e) { display.value = 'Error'; }
        }

        function openMenu() { document.getElementById('menuModal').style.display = 'flex'; }
        function closeMenu() { document.getElementById('menuModal').style.display = 'none'; }

        function switchMode() {
            let mode = document.getElementById('modeSelect').value;
            let body = document.getElementById('modeBody');
            body.innerHTML = '';

            if (mode === 'base') {
                body.innerHTML = `
                    <input type="number" id="decNum" placeholder="Enter Decimal Value">
                    <button class="action-btn" onclick="calcBase()">Calculate</button>
                    <div class="result-box" id="baseRes">[ Screen Ready ]</div>`;
            } else if (mode === 'quad') {
                body.innerHTML = `
                    <input type="number" id="qA" placeholder="Coefficient a">
                    <input type="number" id="qB" placeholder="Coefficient b">
                    <input type="number" id="qC" placeholder="Constant c">
                    <button class="action-btn" onclick="calcQuad()">Calculate</button>
                    <div class="result-box" id="quadRes">[ Screen Ready ]</div>`;
            } else if (mode === 'stat') {
                body.innerHTML = `
                    <input type="text" id="statNums" placeholder="Data separated by comma (e.g. 10,20,30)">
                    <button class="action-btn" onclick="calcStat()">Calculate</button>
                    <div class="result-box" id="statRes">[ Screen Ready ]</div>`;
            } else if (mode === 'matrix') {
                body.innerHTML = `
                    <input type="text" id="matA" placeholder="Matrix A Row (e.g. 1,2)">
                    <input type="text" id="matB" placeholder="Matrix B Row (e.g. 3,4)">
                    <button class="action-btn" onclick="calcMatrix()">Calculate</button>
                    <div class="result-box" id="matRes">[ Screen Ready ]</div>`;
            } else if (mode === 'vector') {
                body.innerHTML = `
                    <input type="text" id="vecA" placeholder="Vector A (e.g. 1,2,3)">
                    <input type="text" id="vecB" placeholder="Vector B (e.g. 4,5,6)">
                    <button class="action-btn" onclick="calcVector()">Calculate</button>
                    <div class="result-box" id="vecRes">[ Screen Ready ]</div>`;
            } else if (mode === 'finance') {
                body.innerHTML = `
                    <input type="number" id="fP" placeholder="Principal Amount">
                    <input type="number" id="fR" placeholder="Annual Rate (%)">
                    <input type="number" id="fT" placeholder="Time (Years)">
                    <button class="action-btn" onclick="calcFinance()">Calculate</button>
                    <div class="result-box" id="financeRes">[ Screen Ready ]</div>`;
            }
        }

        function calcBase() {
            let n = parseInt(document.getElementById('decNum').value);
            if(isNaN(n)) { document.getElementById('baseRes').innerText = "Error: Invalid Input"; return; }
            document.getElementById('baseRes').innerHTML = `DEC: ${n}<br>HEX: ${n.toString(16).toUpperCase()}<br>OCT: ${n.toString(8)}<br>BIN: ${n.toString(2)}`;
        }

        function calcQuad() {
            let a = parseFloat(document.getElementById('qA').value);
            let b = parseFloat(document.getElementById('qB').value);
            let c = parseFloat(document.getElementById('qC').value);
            if(isNaN(a) || isNaN(b) || isNaN(c)) { document.getElementById('quadRes').innerText = "Error: Missing Coefficients"; return; }
            let d = b*b - 4*a*c;
            let res = "";
            if (d >= 0) {
                let x1 = (-b + Math.sqrt(d)) / (2*a);
                let x2 = (-b - Math.sqrt(d)) / (2*a);
                res = `X1 = ${x1.toFixed(4)}<br>X2 = ${x2.toFixed(4)}`;
            } else {
                let real = (-b / (2*a)).toFixed(4);
                let img = (Math.sqrt(-d) / (2*a)).toFixed(4);
                res = `X1 = ${real} + ${img}i<br>X2 = ${real} - ${img}i`;
            }
            document.getElementById('quadRes').innerHTML = res;
        }

        function calcStat() {
            let arr = document.getElementById('statNums').value.split(',').map(Number);
            if(arr.length === 0 || isNaN(arr[0])) { document.getElementById('statRes').innerText = "Error: Invalid Data Series"; return; }
            let sum = arr.reduce((a,b) => a+b, 0);
            let mean = sum / arr.length;
            let variance = arr.reduce((a,b) => a + Math.pow(b - mean, 2), 0) / arr.length;
            let stdDev = Math.sqrt(variance);
            document.getElementById('statRes').innerHTML = `n = ${arr.length} | Sum = ${sum}<br>Mean = ${mean.toFixed(4)}<br>StdDev = ${stdDev.toFixed(4)}`;
        }

        function calcMatrix() {
            let r1 = document.getElementById('matA').value.split(',').map(Number);
            let r2 = document.getElementById('matB').value.split(',').map(Number);
            if(r1.length !== r2.length || isNaN(r1[0])) { document.getElementById('matRes').innerText = "Error: Dimension Mismatch"; return; }
            let res = r1.map((val, idx) => val + r2[idx]);
            document.getElementById('matRes').innerText = `Result Matrix: [${res.join(', ')}]`;
        }

        function calcVector() {
            let v1 = document.getElementById('vecA').value.split(',').map(Number);
            let v2 = document.getElementById('vecB').value.split(',').map(Number);
            if(v1.length !== 3 || v2.length !== 3 || isNaN(v1[0])) { document.getElementById('vecRes').innerText = "Error: Enter 3D Vectors"; return; }
            let dot = v1[0]*v2[0] + v1[1]*v2[1] + v1[2]*v2[2];
            let cross = [
                v1[1]*v2[2] - v1[2]*v2[1],
                v1[2]*v2[0] - v1[0]*v2[2],
                v1[0]*v2[1] - v1[1]*v2[0]
            ];
            document.getElementById('vecRes').innerHTML = `Dot = ${dot}<br>Cross = [${cross.join(', ')}]`;
        }

        function calcFinance() {
            let p = parseFloat(document.getElementById('fP').value);
            let r = parseFloat(document.getElementById('fR').value);
            let t = parseFloat(document.getElementById('fT').value);
            if(isNaN(p) || isNaN(r) || isNaN(t)) { document.getElementById('financeRes').innerText = "Error: Fill All Fields"; return; }
            let si = (p * r * t) / 100;
            let ci = p * Math.pow((1 + r/100), t) - p;
            document.getElementById('financeRes').innerHTML = `SI = ${si.toFixed(2)}<br>CI = ${ci.toFixed(2)}`;
        }
    </script>
</body>
</html>
<!-- v2.0-Updated -->
