<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO fx-991ES PLUS - Full Layout</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #12121c; color: #fff; }
        
        .calculator { background: #191924; padding: 14px; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.8); width: 410px; border: 2px solid #2d2d42; }

        /* Dual-Line LCD Display Screen */
        .lcd-screen { background: #8fa38f; color: #0b140b; padding: 10px 12px; border-radius: 4px; margin-bottom: 10px; border: 3px inset #525e52; }
        .lcd-top { font-size: 11px; font-family: 'Courier New', Courier, monospace; min-height: 15px; text-align: right; color: #2d3b2d; overflow-x: auto; white-space: nowrap; }
        #display { width: 100%; height: 36px; background: transparent; color: #0b140b; font-size: 24px; font-family: 'Courier New', Courier, monospace; font-weight: bold; text-align: right; border: none; outline: none; }

        /* Keypad Grid matching Real Casio Layout */
        .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        button { padding: 8px 1px; font-size: 10px; cursor: pointer; border: none; border-radius: 3px; background: #262636; color: #e0e0f0; font-weight: 600; transition: 0.05s; }
        button:active { transform: scale(0.95); }

        /* Specialized Casio Colors */
        button.shift { background: #d97706; color: #fff; font-weight: bold; }
        button.alpha { background: #6366f1; color: #fff; font-weight: bold; }
        button.mode { background: #33334d; color: #38bdf8; font-size: 9px; }
        button.math-op { color: #f472b6; font-size: 10px; }
        button.operator { color: #38bdf8; font-weight: bold; font-size: 11px; }
        button.del-btn { background: #15803d; color: #fff; font-weight: bold; }
        button.ac-btn { background: #dc2626; color: #fff; font-weight: bold; }
        button.equal { background: #16a34a; color: #fff; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="lcd-screen">
            <div class="lcd-top" id="lcdTop">NATURAL-V.P.A.M.</div>
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <div class="buttons">
            <!-- Row 1 -->
            <button class="shift" onclick="toggleShift()">SHIFT</button>
            <button class="alpha">ALPHA</button>
            <button class="mode">MODE</button>
            <button class="mode">CALC</button>
            <button class="mode">∫dx</button>

            <!-- Row 2 -->
            <button class="math-op" onclick="appendValue('**2')">x²</button>
            <button class="math-op" onclick="appendValue('**')">x^y</button>
            <button class="math-op" onclick="appendValue('Math.sqrt(')">√</button>
            <button class="math-op" onclick="appendValue('Math.log10(')">log</button>
            <button class="math-op" onclick="appendValue('Math.log(')">ln</button>

            <!-- Row 3 -->
            <button class="math-op" id="btnSin" onclick="handleTrig('sin')">sin</button>
            <button class="math-op" id="btnCos" onclick="handleTrig('cos')">cos</button>
            <button class="math-op" id="btnTan" onclick="handleTrig('tan')">tan</button>
            <button class="math-op" onclick="appendValue('(-)')">(-)</button>
            <button class="math-op" onclick="appendValue('Math.hypot(')">hyp</button>

            <!-- Row 4 -->
            <button class="math-op" onclick="appendValue('')">RCL</button>
            <button class="math-op" onclick="appendValue('')">ENG</button>
            <button class="math-op" onclick="appendValue('(')">(</button>
            <button class="math-op" onclick="appendValue(')')">)</button>
            <button class="math-op" onclick="appendValue('S-D')">S⇄D</button>

            <!-- Row 5 -->
            <button class="math-op" onclick="appendValue('Math.PI')">π</button>
            <button class="math-op" onclick="appendValue('Math.E')">e</button>
            <button class="math-op" onclick="appendValue('1/(')">x⁻¹</button>
            <button class="del-btn" onclick="backspace()">DEL</button>
            <button class="ac-btn" onclick="clearDisplay()">AC</button>

            <!-- Row 6 -->
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <!-- Row 7 -->
            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <!-- Row 8 -->
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="math-op" onclick="appendValue('10**')">×10ˣ</button>
            <button class="math-op" onclick="appendValue('ans')">Ans</button>

            <!-- Row 9 -->
            <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="math-op" onclick="appendValue('Math.random()')">Rnd</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const lcdTop = document.getElementById('lcdTop');
        let lastAns = 0;
        let isShiftActive = false;

        function toggleShift() {
            isShiftActive = !isShiftActive;
            document.getElementById('btnSin').innerText = isShiftActive ? 'sin⁻¹' : 'sin';
            document.getElementById('btnCos').innerText = isShiftActive ? 'cos⁻¹' : 'cos';
            document.getElementById('btnTan').innerText = isShiftActive ? 'tan⁻¹' : 'tan';
        }

        function handleTrig(type) {
            if (isShiftActive) {
                if (type === 'sin') appendValue('Math.asin(');
                if (type === 'cos') appendValue('Math.acos(');
                if (type === 'tan') appendValue('Math.atan(');
                isShiftActive = false;
                toggleShift(); // reset text
            } else {
                if (type === 'sin') appendValue('Math.sin(');
                if (type === 'cos') appendValue('Math.cos(');
                if (type === 'tan') appendValue('Math.tan(');
            }
        }

        function appendValue(val) { 
            if(val === 'ans') { display.value += lastAns; }
            else if(val === 'S-D') { 
                // Toggle decimal/fraction approximation effect if numeric
                let num = parseFloat(display.value);
                if(!isNaN(num)) display.value = (1 / num).toFixed(4); 
            }
            else { display.value += val; }
        }

        function clearDisplay() { 
            display.value = ''; 
            lcdTop.innerText = 'NATURAL-V.P.A.M.';
        }

        function backspace() { 
            display.value = display.value.slice(0, -1); 
        }

        function calculate() {
            try { 
                lcdTop.innerText = display.value + ' =';
                let res = eval(display.value);
                if(Number.isFinite(res)) {
                    lastAns = res;
                    display.value = res;
                } else {
                    display.value = 'Math Error';
                }
            } catch (e) { 
                display.value = 'Syntax Error'; 
            }
        }
    </script>
</body>
</html>
