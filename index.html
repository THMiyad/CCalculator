<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO fx-991ES PLUS - Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #12121c; color: #fff; }
        
        .calculator { background: #1b1b28; padding: 12px; border-radius: 12px; box-shadow: 0 10px 35px rgba(0,0,0,0.9); width: 390px; border: 2px solid #2d2d42; }

        /* Top Status Indicator Bar */
        .status-bar { font-size: 10px; font-family: monospace; color: #f59e0b; margin-bottom: 3px; min-height: 14px; font-weight: bold; }

        /* Dual-Line LCD Display Screen */
        .lcd-screen { background: #8fa38f; color: #0b140b; padding: 8px 10px; border-radius: 4px; margin-bottom: 10px; border: 3px inset #525e52; }
        .lcd-top { font-size: 11px; font-family: 'Courier New', Courier, monospace; min-height: 15px; text-align: right; color: #2d3b2d; overflow-x: auto; white-space: nowrap; }
        #display { width: 100%; height: 35px; background: transparent; color: #0b140b; font-size: 24px; font-family: 'Courier New', Courier, monospace; font-weight: bold; text-align: right; border: none; outline: none; }

        /* Keypad Grid matching Casio Layout */
        .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .btn-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 1px; font-size: 11px; cursor: pointer; border: none; border-radius: 3px; background: #262636; color: #e0e0f0; font-weight: 600; height: 42px; transition: 0.05s; }
        .btn-box:active { transform: scale(0.95); }

        .sup-text { font-size: 8px; color: #f59e0b; margin-bottom: 1px; line-height: 1; }
        .alpha-text { color: #818cf8; }

        /* Specialized Casio Colors */
        .shift-btn { background: #d97706 !important; color: #fff !important; font-weight: bold; }
        .alpha-btn { background: #6366f1 !important; color: #fff !important; font-weight: bold; }
        .mode-btn { background: #33334d; color: #38bdf8; font-size: 9px; }
        .math-op { color: #f472b6; }
        .operator { color: #38bdf8; font-weight: bold; }
        .del-btn { background: #15803d !important; color: #fff !important; font-weight: bold; }
        .ac-btn { background: #dc2626 !important; color: #fff !important; font-weight: bold; }
        .equal-btn { background: #16a34a !important; color: #fff !important; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

    <div class="calculator">
        <div class="status-bar" id(statusBar)></div>
        <div class="lcd-screen">
            <div class="lcd-top" id="lcdTop">NATURAL-V.P.A.M.</div>
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <div class="buttons">
            <!-- Row 1 -->
            <button class="btn-box shift-btn" id="shiftKey" onclick="toggleShift()">SHIFT</button>
            <button class="btn-box alpha-btn" id="alphaKey" onclick="toggleAlpha()">ALPHA</button>
            <button class="btn-box mode-btn" onclick="appendValue('MODE')">MODE</button>
            <button class="btn-box mode-btn" onclick="appendValue('CALC')">CALC</button>
            <button class="btn-box mode-btn" onclick="appendValue('Math.imul(')">∫dx</button>

            <!-- Row 2 -->
            <button class="btn-box" onclick="appendValue('**2')"><span class="sup-text">³√ / x²</span>x²</button>
            <button class="btn-box" onclick="appendValue('**')"><span class="sup-text">x√ / x^y</span>x^y</button>
            <button class="btn-box" onclick="appendValue('Math.sqrt(')"><span class="sup-text">10ˣ</span>√</button>
            <button class="btn-box" onclick="appendValue('Math.log10(')"><span class="sup-text">eˣ</span>log</button>
            <button class="btn-box" onclick="appendValue('Math.log(')"><span class="sup-text"></span>ln</button>

            <!-- Row 3 -->
            <button class="btn-box math-op" id="trigSin" onclick="pressTrig('sin')"><span class="sup-text alpha-text" id="supSin">sin⁻¹</span>sin</button>
            <button class="btn-box math-op" id="trigCos" onclick="pressTrig('cos')"><span class="sup-text alpha-text" id="supCos">cos⁻¹</span>cos</button>
            <button class="btn-box math-op" id="trigTan" onclick="pressTrig('tan')"><span class="sup-text alpha-text" id="supTan">tan⁻¹</span>tan</button>
            <button class="btn-box math-op" onclick="appendValue('(-)')"><span class="sup-text"></span>(-)</button>
            <button class="btn-box math-op" onclick="appendValue('Math.hypot(')"><span class="sup-text"></span>hyp</button>

            <!-- Row 4 -->
            <button class="btn-box math-op" onclick="appendValue('RCL')"><span class="sup-text">STO</span>RCL</button>
            <button class="btn-box math-op" onclick="appendValue('ENG')"><span class="sup-text">←</span>ENG</button>
            <button class="btn-box math-op" onclick="appendValue('(')"><span class="sup-text">[</span>(</button>
            <button class="btn-box math-op" onclick="appendValue(')')"><span class="sup-text">]</span>)</button>
            <button class="btn-box math-op" onclick="toggleSD()"><span class="sup-text"></span>S⇄D</button>

            <!-- Row 5 -->
            <button class="btn-box math-op" onclick="appendValue('Math.PI')"><span class="sup-text">CONST</span>π</button>
            <button class="btn-box math-op" onclick="appendValue('Math.E')"><span class="sup-text">CONV</span>e</button>
            <button class="btn-box math-op" onclick="appendValue('1/(')"><span class="sup-text">i</span>x⁻¹</button>
            <button class="btn-box del-btn" onclick="backspace()">DEL</button>
            <button class="btn-box ac-btn" onclick="clearDisplay()">AC</button>

            <!-- Row 6 -->
            <button class="btn-box" onclick="appendValue('7')"><span class="sup-text alpha-text">A</span>7</button>
            <button class="btn-box" onclick="appendValue('8')"><span class="sup-text alpha-text">B</span>8</button>
            <button class="btn-box" onclick="appendValue('9')"><span class="sup-text alpha-text">C</span>9</button>
            <button class="btn-box operator" onclick="appendValue('*')"><span class="sup-text">nPr</span>×</button>
            <button class="btn-box operator" onclick="appendValue('/')"><span class="sup-text">nCr</span>÷</button>

            <!-- Row 7 -->
            <button class="btn-box" onclick="appendValue('4')"><span class="sup-text alpha-text">D</span>4</button>
            <button class="btn-box" onclick="appendValue('5')"><span class="sup-text alpha-text">E</span>5</button>
            <button class="btn-box" onclick="appendValue('6')"><span class="sup-text alpha-text">F</span>6</button>
            <button class="btn-box operator" onclick="appendValue('+')"><span class="sup-text"></span>+</button>
            <button class="btn-box operator" onclick="appendValue('-')"><span class="sup-text"></span>-</button>

            <!-- Row 8 -->
            <button class="btn-box" onclick="appendValue('1')"><span class="sup-text alpha-text">X</span>1</button>
            <button class="btn-box" onclick="appendValue('2')"><span class="sup-text alpha-text">Y</span>2</button>
            <button class="btn-box" onclick="appendValue('3')"><span class="sup-text alpha-text">M</span>3</button>
            <button class="btn-box math-op" onclick="appendValue('10**')"><span class="sup-text">Pol</span>×10ˣ</button>
            <button class="btn-box math-op" onclick="appendValue('ans')"><span class="sup-text">Rec</span>Ans</button>

            <!-- Row 9 -->
            <button class="btn-box" onclick="appendValue('0')" style="grid-column: span 2; width: 100%;"><span class="sup-text">Rnd</span>0</button>
            <button class="btn-box" onclick="appendValue('.')"><span class="sup-text">Ran#</span>.</button>
            <button class="btn-box math-op" onclick="appendValue('Math.random()')"><span class="sup-text">DRG</span>Rnd</button>
            <button class="btn-box equal-btn" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const lcdTop = document.getElementById('lcdTop');
        const shiftKey = document.getElementById('shiftKey');
        const alphaKey = document.getElementById('alphaKey');
        
        let lastAns = 0;
        let isShift = false;
        let isAlpha = false;

        function toggleShift() {
            isShift = !isShift;
            isAlpha = false;
            shiftKey.style.background = isShift ? '#ff9800' : '#d97706';
            alphaKey.style.background = '#6366f1';
            document.getElementById('statusBar').innerText = isShift ? 'SHIFT ACTIVE' : '';
        }

        function toggleAlpha() {
            isAlpha = !isAlpha;
            isShift = false;
            alphaKey.style.background = isAlpha ? '#818cf8' : '#6366f1';
            shiftKey.style.background = '#d97706';
            document.getElementById('statusBar').innerText = isAlpha ? 'ALPHA ACTIVE' : '';
        }

        function pressTrig(func) {
            if (isShift) {
                if (func === 'sin') appendValue('Math.asin(');
                if (func === 'cos') appendValue('Math.acos(');
                if (func === 'tan') appendValue('Math.atan(');
                isShift = false;
                shiftKey.style.background = '#d97706';
                document.getElementById('statusBar').innerText = '';
            } else {
                if (func === 'sin') appendValue('Math.sin(');
                if (func === 'cos') appendValue('Math.cos(');
                if (func === 'tan') appendValue('Math.tan(');
            }
        }

        function appendValue(val) { 
            if(isAlpha) {
                // If Alpha is active, map numbers/keys to variables A, B, C etc.
                isAlpha = false;
                alphaKey.style.background = '#6366f1';
                document.getElementById('statusBar').innerText = '';
            }
            if(val === 'ans') { display.value += lastAns; }
            else { display.value += val; }
        }

        function toggleSD() {
            let num = parseFloat(display.value);
            if(!isNaN(num)) {
                display.value = (1 / num).toFixed(4);
            }
        }

        function clearDisplay() { 
            display.value = ''; 
            lcdTop.innerText = 'NATURAL-V.P.A.M.';
            isShift = false; isAlpha = false;
            shiftKey.style.background = '#d97706';
            alphaKey.style.background = '#6366f1';
            document.getElementById('statusBar').innerText = '';
        }

        function backspace() { 
            display.value = display.value.slice(0, -1); 
        }

        function calculate() {
            try { 
                lcdTop.innerText = display.value + ' =';
                let res = eval(display.value);
                if(Number.isFinite(res)) {
                    lastAns = res;
                    display.value = res;
                } else {
                    display.value = 'Math Error';
                }
            } catch (e) { 
                display.value = 'Syntax Error'; 
            }
        }
    </script>
</body>
</html>
