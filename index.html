<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Scientific Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1e1e2f;
        }

        .calculator {
            background: #2b2b40;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 400px;
        }

        #display {
            width: 100%;
            height: 70px;
            background: #1a1a26;
            color: #00ffcc;
            font-size: 28px;
            text-align: right;
            padding: 12px;
            border: none;
            border-radius: 8px;
            margin-bottom: 15px;
            outline: none;
            box-inset: 0 2px 5px rgba(0,0,0,0.5);
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        button {
            padding: 12px 5px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #3a3a55;
            color: #ffffff;
            transition: 0.2s;
            font-weight: 600;
        }

        button:hover {
            background: #4e4e75;
        }

        button.operator {
            background: #ff9500;
        }

        button.operator:hover {
            background: #e08500;
        }

        button.sci {
            background: #4a4ae2;
        }

        button.sci:hover {
            background: #3b3bc7;
        }

        button.memory {
            background: #5c3566;
        }

        button.memory:hover {
            background: #754582;
        }

        button.equal {
            background: #34c759;
            grid-column: span 2;
        }

        button.equal:hover {
            background: #2da84d;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <input type="text" id="display" readonly>
        <div class="buttons">
            <!-- Memory & Clear -->
            <button class="memory" onclick="memoryClear()">MC</button>
            <button class="memory" onclick="memoryRecall()">MR</button>
            <button class="memory" onclick="memoryAdd()">M+</button>
            <button class="memory" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="backspace()">⌫</button>

            <!-- Scientific Row 1 -->
            <button class="sci" onclick="appendValue('Math.sin(')">sin</button>
            <button class="sci" onclick="appendValue('Math.cos(')">cos</button>
            <button class="sci" onclick="appendValue('Math.tan(')">tan</button>
            <button class="sci" onclick="appendValue('Math.PI')">π</button>
            <button class="sci" onclick="appendValue('Math.E')">e</button>

            <!-- Scientific Row 2 -->
            <button class="sci" onclick="appendValue('Math.asin(')">asin</button>
            <button class="sci" onclick="appendValue('Math.acos(')">acos</button>
            <button class="sci" onclick="appendValue('Math.atan(')">atan</button>
            <button class="sci" onclick="appendValue('Math.sqrt(')">√</button>
            <button class="sci" onclick="appendValue('**2')">x²</button>

            <!-- Scientific Row 3 -->
            <button class="sci" onclick="appendValue('Math.log10(')">log</button>
            <button class="sci" onclick="appendValue('Math.log(')">ln</button>
            <button class="sci" onclick="appendValue('**')">x^y</button>
            <button class="sci" onclick="appendValue('(')">(</button>
            <button class="sci" onclick="appendValue(')')">)</button>

            <!-- Standard Numbers & Operators -->
            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('/')">÷</button>
            <button class="operator" onclick="appendValue('%')">%</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('*')">×</button>
            <button class="sci" onclick="appendValue('1/')">1/x</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('-')">-</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        let memory = 0;

        function appendValue(val) {
            display.value += val;
        }

        function clearDisplay() {
            display.value = '';
        }

        function backspace() {
            display.value = display.value.slice(0, -1);
        }

        function memoryClear() {
            memory = 0;
        }

        function memoryRecall() {
            display.value += memory;
        }

        function memoryAdd() {
            try {
                memory += eval(display.value) || 0;
            } catch (e) {
                display.value = 'Error';
            }
        }

        function calculate() {
            try {
                let result = eval(display.value);
                display.value = Number.isFinite(result) ? result : 'Error';
            } catch (error) {
                display.value = 'Error';
            }
        }
    </script>
</body>
</html>
