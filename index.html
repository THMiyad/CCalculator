<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CASIO fx-991ES PLUS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #121216; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #fff; }

        .calculator { background: #1c1c24; padding: 15px; border-radius: 12px; width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 2px solid #2e2e3d; }
        .brand-section { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; font-size: 11px; color: #aaa; }
        .brand { font-weight: bold; font-size: 14px; letter-spacing: 1px; color: #fff; }
        .model { color: #f39c12; font-weight: bold; }
        .sub-model { font-size: 9px; color: #2ecc71; }

        .lcd-screen { background: #9ebd9e; color: #000; padding: 8px; border-radius: 4px; margin-bottom: 12px; border: 3px inset #6a7d6a; }
        .lcd-top { font-size: 9px; font-family: monospace; font-weight: bold; color: #222; margin-bottom: 4px; }
        #display { width: 100%; height: 32px; background: transparent; border: none; font-size: 22px; font-family: monospace; font-weight: bold; text-align: right; outline: none; color: #000; }

        .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .btn { background: #2b2b36; color: #fff; border: none; border-radius: 4px; height: 36px; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.1s; }
        .btn:active { transform: scale(0.92); }

        .shift-key { background: #d35400; }
        .alpha-key { background: #8e44ad; }
        .mode-key, .on-key, .replay-key { background: #34495e; font-size: 9px; }
        .ac-key { background: #e74c3c; }
        .del-key { background: #27ae60; }
        .operator { color: #3498db; }
        .exe-key { background: #2980b9; font-size: 14px; }
    </style>
</head>
<body>
    <div class="calculator">
        <!-- Brand & Model -->
        <div class="brand-section">
            <div>
                <span class="brand">CASIO</span>
                <span class="model">fx-991ES PLUS</span>
            </div>
            <div>
                <span class="sub-model">NATURAL-V.P.A.M.</span>
            </div>
        </div>

        <!-- LCD Screen -->
        <div class="lcd-screen">
            <div class="lcd-top" id="lcdTop">COMP DEG NORM1 MATH</div>
            <input type="text" id="display" readonly placeholder="0">
        </div>

        <!-- Keypad Layout -->
        <div class="buttons">
            <button class="btn shift-key" onclick="setNotice('SHIFT Active')">SHIFT</button>
            <button class="btn alpha-key" onclick="setNotice('ALPHA Active')">ALPHA</button>
            <button class="btn replay-key" onclick="setNotice('REPLAY Active')">REPLAY</button>
            <button class="btn mode-key" onclick="setNotice('MODE: 1.COMP 2.STAT')">MODE</button>
            <button class="btn on-key" onclick="clearAll()">ON</button>

            <button class="btn" onclick="appendVal('CALC')">CALC</button>
            <button class="btn" onclick="appendVal('∫dx')">∫dx</button>
            <button class="btn" onclick="appendVal('x⁻¹')">x⁻¹</button>
            <button class="btn" onclick="appendVal('logᵧx')">logᵧx</button>
            <button class="btn" onclick="appendVal('√(')">√</button>

            <button class="btn" onclick="appendVal('²')">x²</button>
            <button class="btn" onclick="appendVal('^')">xʸ</button>
            <button class="btn" onclick="appendVal('log(')">log</button>
            <button class="btn" onclick="appendVal('ln(')">ln</button>
            <button class="btn" onclick="appendVal('(-)')">(-)</button>

            <button class="btn" onclick="appendVal('hyp')">hyp</button>
            <button class="btn" onclick="appendVal('sin(')">sin</button>
            <button class="btn" onclick="appendVal('cos(')">cos</button>
            <button class="btn" onclick="appendVal('tan(')">tan</button>
            <button class="btn" onclick="appendVal('RCL')">RCL</button>

            <button class="btn" onclick="appendVal('ENG')">ENG</button>
            <button class="btn" onclick="appendVal('(')">(</button>
            <button class="btn" onclick="appendVal(')')">)</button>
            <button class="btn" onclick="appendVal('S-D')">S⇄D</button>
            <button class="btn" onclick="appendVal('M+')">M+</button>

            <button class="btn" onclick="appendVal('7')">7</button>
            <button class="btn" onclick="appendVal('8')">8</button>
            <button class="btn" onclick="appendVal('9')">9</button>
            <button class="btn del-key" onclick="backspace()">DEL</button>
            <button class="btn ac-key" onclick="clearAll()">AC</button>

            <button class="btn" onclick="appendVal('4')">4</button>
            <button class="btn" onclick="appendVal('5')">5</button>
            <button class="btn" onclick="appendVal('6')">6</button>
            <button class="btn operator" onclick="appendVal('*')">×</button>
            <button class="btn operator" onclick="appendVal('/')">÷</button>

            <button class="btn" onclick="appendVal('1')">1</button>
            <button class="btn" onclick="appendVal('2')">2</button>
            <button class="btn" onclick="appendVal('3')">3</button>
            <button class="btn operator" onclick="appendVal('+')">+</button>
            <button class="btn operator" onclick="appendVal('-')">-</button>

            <button class="btn" onclick="appendVal('0')">0</button>
            <button class="btn" onclick="appendVal('.')">.</button>
            <button class="btn" onclick="appendVal('E')">×10ˣ</button>
            <button class="btn" onclick="appendVal('Ans')">Ans</button>
            <button class="btn exe-key" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const lcdTop = document.getElementById('lcdTop');
        let expr = "";
        let lastAns = 0;

        function appendVal(v) {
            expr += v;
            display.value = expr;
        }

        function clearAll() {
            expr = "";
            display.value = "0";
            lcdTop.innerText = "COMP DEG NORM1 MATH";
        }

        function backspace() {
            expr = expr.slice(0, -1);
            display.value = expr === "" ? "0" : expr;
        }

        function setNotice(text) {
            lcdTop.innerText = text;
        }

        function calculate() {
            try {
                let clean = expr
                    .replace(/×/g, '*')
                    .replace(/÷/g, '/')
                    .replace(/Ans/g, lastAns)
                    .replace(/²/, '**2');

                let res = eval(clean);
                if (Number.isFinite(res)) {
                    display.value = res;
                    lastAns = res;
                    expr = res.toString();
                } else {
                    display.value = "Math Error";
                }
            } catch (e) {
                display.value = "Syntax Error";
            }
        }
    </script>
</body>
</html>
